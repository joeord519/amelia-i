<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Piston Read-Only Calendar</title>

  <!-- ✅ Include FullCalendar Scheduler bundle -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.9/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.9/index.global.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
    }

    #calendar {
      max-width: 1400px;
      margin: 40px auto;
      background: white;
      border-radius: 8px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="calendar"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        schedulerLicenseKey: 'GPL-My-Project-Is-Open-Source',
        initialView: 'resourceTimelineDay',
        slotMinTime: '06:00:00',
        slotMaxTime: '22:00:00',
        editable: false,
        selectable: false,
        nowIndicator: true,
        resourceAreaHeaderContent: 'Resources',
        height: 'auto',

        resources: 'fetch_resources.php',
        events: 'fetch_flight.php'
      });

      calendar.render();
    });
  </script>

</body>
</html>
