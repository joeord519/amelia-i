<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Schedule Your Flight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Bangers", cursive;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-direction: column;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    label {
      font-size: 1.2rem;
      margin-top: 15px;
      display: block;
    }

    select, button {
      font-size: 1.1rem;
      padding: 10px;
      width: 300px;
      max-width: 100%;
      margin-top: 5px;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      margin-top: 30px;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>✈️ Schedule Your Flight</h1>

  <label for="location">Location</label>
  <select id="location"></select>

  <label for="aircraft">Aircraft</label>
  <select id="aircraft"></select>

  <label for="flightType">Type of Flight</label>
  <select id="flightType"></select>

  <div id="cfiWrapper" style="display:none;">
    <label for="cfi">Instructor</label>
    <select id="cfi"></select>
  </div>

  <button id="nextBtn">Next</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get("phone") || "";

    $(document).ready(() => {
      loadLocations();
      loadFlightTypes();

      $('#location').on('change', function () {
        loadAircraft($(this).val());
        $('#cfi').html(''); // reset CFI when location changes
      });

      $('#aircraft').on('change', function () {
        const loc = $('#location').val();
        loadInstructors(loc);
      });

      $('#flightType').on('change', function () {
        const selected = $('#flightType').find(':selected');
        const needsCFI = selected.data('requires-cfi');
        $('#cfiWrapper').toggle(needsCFI);
      });

      $('#nextBtn').on('click', () => {
        const location = $('#location').val();
        const aircraft = $('#aircraft').val();
        const type = $('#flightType').val();
        const cfi = $('#cfi').val();

        if (!location || !aircraft || !type || ($('#cfiWrapper').is(':visible') && !cfi)) {
          Swal.fire('Hold up!', 'Please fill out all required fields.', 'warning');
          return;
        }

        // TODO: Proceed to date/time selection
        Swal.fire('Coming Next', 'Date/time selection coming up next…', 'info');
      });
    });

    function loadLocations() {
      $.getJSON("fetch_locations.php", function (data) {
        $('#location').html(data.map(loc => `<option value="${loc.id}">${loc.name}</option>`));
        if (data.length) {
          $('#location').trigger('change');
        }
      });
    }

    function loadAircraft(locationId) {
      $.getJSON("fetch_aircraft.php?loc=" + locationId, function (data) {
        $('#aircraft').html(data.map(a => `<option value="${a.id}">${a.tail_number}</option>`));
      });
    }

    function loadFlightTypes() {
      $.getJSON("fetch_flight_types.php", function (data) {
        $('#flightType').html(data.map(type => `<option value="${type.id}" data-requires-cfi="${type.requires_cfi}">${type.name}</option>`));
        $('#flightType').trigger('change');
      });
    }

    function loadInstructors(locationId) {
      $.getJSON("fetch_instructors.php?loc=" + locationId, function (data) {
        $('#cfi').html(data.map(i => `<option value="${i.id}">${i.name}</option>`));
      });
    }
  </script>
</body>
</html>
