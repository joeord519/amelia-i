<!-- === calendar.html === -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📆 Piston Aircraft Scheduler</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.8/index.global.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.27/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 
  <style>
  body {
    font-family: Arial, sans-serif;
    font-weight: bold;
    background: #fafaff;
    margin: 0;
  }

  h1 {
    text-align: center;
    font-size: 2.2rem;
    padding: 14px;
    background: #222;
    color: #f8d210;
    text-shadow: 2px 2px #000;
    font-family: Arial, sans-serif;
    font-weight: bold;
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #f5f5f5;
    border-bottom: 2px solid #000;
    position: relative;
  }

  #filter-btn {
    margin-left: auto;
  }

  select,
  button,
  .swal2-input,
  .swal2-select {
    font-family: Arial, sans-serif !important;
    font-weight: bold;
    font-size: 1rem;
    padding: 8px 12px;
    border: 2px solid #000;
    background: #fff;
    cursor: pointer;
  }

  button:hover {
    background: #ffec99;
    transform: scale(1.05);
  }

  #calendar {
    padding: 10px 20px;
  }

  .fc-event {
    font-family: Arial, sans-serif !important;
    font-size: 0.95rem;
    font-weight: bold;
    border: 2px solid #000;
    text-shadow: 1px 1px #fff;
  }

  .fc .fc-toolbar-title {
    font-family: Arial, sans-serif !important;
    font-weight: bold;
    color: #222;
    letter-spacing: 1px;
  }

  .fc-license-message {
    display: none;
  }

  .fc-resource-timeline .fc-timeline-lane {
    background-color: #fffbe6;
    border-bottom: 1px solid #ccc;
  }

  .fc-resource-area .fc-scrollgrid-sync-inner {
    background-color: #ffd700;
    font-weight: bold;
    color: #000;
    text-shadow: none;
    font-family: Arial, sans-serif;
  }
</style>

  </style>
</head>
<body>
  <h1>📆 Piston Aircraft Scheduler</h1>

  <div id="controls">
    <button data-range="today">Today</button>
    <button data-range="tomorrow">Tomorrow</button>
    <button data-range="7days">Next 7 Days</button>
    <button data-range="month">This Month</button>
    <button data-range="30days">Next 30 Days</button>
      </div>

  <div id="calendar"></div>

  <script src="./calendar.js"></script>
</body>
</html>
