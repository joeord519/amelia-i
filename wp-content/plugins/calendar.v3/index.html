<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Piston Admin Calendar</title>

  <!-- ✅ Load FullCalendar Core + Scheduler Bundle -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.8/index.global.min.js"></script>

  <!-- ✅ SweetAlert2 for modals -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    html, body {
      font-family: sans-serif;
      padding: 0;
      margin: 0;
    }

    #calendar {
      height: 100vh;
      width: 100vw;
    }

    #user-info {
      position: fixed;
      top: 15px;
      right: 200px;
      font-weight: bold;
      font-size: 14px;
      z-index: 9999;
      background: #f4f4f4;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
    }

    #user-info a {
      color: #0066cc;
      text-decoration: none;
      margin-left: 5px;
    }

    #calendar-controls {
      position: fixed;
      top: 15px;
      left: 300px;
      display: flex;
      gap: 12px;
      z-index: 99999;
      pointer-events: auto;
    }

    #calendar-controls button {
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      z-index: 100000;
      pointer-events: auto;
    }

    #companyEventBtn {
      background-color: #1e293b;
    }

   #sessionNote {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  background-color: #eff6ff;
  color: #2563eb;
  padding: 10px 18px;
  font-size: 1rem;
  font-weight: bold;
  border: 1px solid #93c5fd;
  border-radius: 8px;
  z-index: 100000;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

/* ✅ Fade in animation triggers AFTER the element is added */
#sessionNote.fade-in {
  opacity: 1;
}

/* ✅ Fade out triggers AFTER the visible time */
#sessionNote.fade-out {
  opacity: 0;
}

  </style>
</head>
<body>

  <div id="user-info">
    Logged in as: <span id="userNameDisplay"></span> (<span id="userRoleDisplay"></span>)
  </div>

  <div id="calendar-controls">
    <button id="companyEventBtn">📅 Create Company Event</button>
  </div>

  <!-- ✅ Wrapped calendar in a container for note injection -->
  <div id="calendarContainer">
    <div id="calendar"></div>
  </div>

  <script src="admin-calendar.js"></script>
</body>
</html>
